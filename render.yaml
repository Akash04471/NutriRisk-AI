services:
  - type: web
    name: nutririsk-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt || pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT || uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
